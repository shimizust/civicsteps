name: Backfill new areas
# Dispatched when a user saves a ZIP in a state or supported council area that needs indexing.
# The nightly workflow shares this concurrency group because both write the same index.
on:
  workflow_dispatch:

concurrency:
  group: ingest
  queue: max

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
    steps:
      # Forks and repos without a hosted database skip instead of failing every night.
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::notice::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY secrets are not set; skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cfg.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.cfg.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.cfg.outputs.ok == 'true'
        run: npm ci
      # --wait so the new bills are analyzed (and show in feeds) in this run rather than tomorrow night's.
      - if: steps.cfg.outputs.ok == 'true'
        run: npm run ingest -- --only=openstates,legistar,locations,analyze --new-areas-only --wait
