name: Nightly ingest
on:
  schedule:
    - cron: "15 9 * * *" # 09:15 UTC ≈ 1–2am Pacific
  workflow_dispatch:
    inputs:
      args:
        description: "Extra args for npm run ingest, e.g. --only=federalregister --limit=20"
        required: false

concurrency: ingest

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      API_DATA_GOV_KEY: ${{ secrets.API_DATA_GOV_KEY }}
      OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
    steps:
      # Forks and repos without a hosted database skip instead of failing every night.
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::notice::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY secrets are not set; skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cfg.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.cfg.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.cfg.outputs.ok == 'true'
        run: npm ci
      - if: steps.cfg.outputs.ok == 'true'
        run: npm run ingest -- ${{ inputs.args }}
      - if: steps.cfg.outputs.ok == 'true'
        run: npm run notify
